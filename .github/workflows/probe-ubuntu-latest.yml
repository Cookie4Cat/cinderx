name: Probe ubuntu-latest

on:
  push:
    branches:
      - codex/probe-ubuntu-latest-worktree
  workflow_dispatch:

jobs:
  probe:
    name: Probe runner environment
    runs-on: ubuntu-latest

    steps:
      - name: Show runner image and OS details
        shell: bash
        run: |
          set -euxo pipefail
          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-}"
          echo
          cat /etc/os-release
          echo
          uname -a
          echo
          lsb_release -a || true
          echo
          echo "Kernel:"
          uname -r

      - name: Show default toolchain before setup-python
        shell: bash
        run: |
          set -euxo pipefail
          which python3 || true
          python3 --version || true
          which pip3 || true
          pip3 --version || true
          which gcc || true
          gcc --version | head -n 1 || true
          which g++ || true
          g++ --version | head -n 1 || true
          which clang || true
          clang --version | head -n 1 || true
          which cmake || true
          cmake --version | head -n 1 || true
          which ninja || true
          ninja --version || true
          which make || true
          make --version | head -n 1 || true
          which git || true
          git --version || true
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' || true

      - name: Set up Python 3.14.3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - name: Show Python after setup-python
        shell: bash
        run: |
          set -euxo pipefail
          which python
          python --version
          python -c "import platform, sys, sysconfig; print('executable=', sys.executable); print('version=', sys.version); print('platform=', platform.platform()); print('include=', sysconfig.get_path('include'))"
          which pip
          pip --version

      - name: Install and show cibuildwheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          python -m cibuildwheel --version

      - name: Show toolchains inside cibuildwheel wheel images
        shell: bash
        run: |
          set -euxo pipefail
          for image in \
            quay.io/pypa/manylinux_2_28:latest \
            quay.io/pypa/musllinux_1_2:latest
          do
            echo "=== $image ==="
            docker pull "$image"
            docker run --rm "$image" /bin/sh -lc '
              echo "image=$0"
              echo "CC=${CC:-}"
              echo "CXX=${CXX:-}"
              cat /etc/os-release || true
              uname -a || true
              echo "gcc=$(command -v gcc || true)"
              gcc --version | head -n 1 || true
              echo "g++=$(command -v g++ || true)"
              g++ --version | head -n 1 || true
              echo "clang=$(command -v clang || true)"
              clang --version | head -n 1 || true
              echo "clang++=$(command -v clang++ || true)"
              clang++ --version | head -n 1 || true
              echo "cmake=$(command -v cmake || true)"
              cmake --version | head -n 1 || true
              echo "python3=$(command -v python3 || true)"
              python3 --version || true
              python3 - <<'"'"'PY'"'"'
import os
import re
import shutil
import subprocess

MIN_GCC_VERSION = 13

cc_path = os.environ.get("CC")
cxx_path = os.environ.get("CXX")
if cc_path and cxx_path:
    print(f"selected_compiler={cc_path} {cxx_path} (from CC/CXX)")
else:
    gcc_path = shutil.which("gcc")
    gxx_path = shutil.which("g++")
    if gcc_path and gxx_path:
        out = subprocess.check_output([gcc_path, "--version"], text=True)
        match = re.search(r"gcc.*?(\d+)\.(\d+)(?:\.(\d+))?", out, re.IGNORECASE)
        if match and int(match.group(1)) >= MIN_GCC_VERSION:
            print(f"selected_compiler={gcc_path} {gxx_path} (preferred GCC)")
        else:
            clang_path = shutil.which("clang")
            clangxx_path = shutil.which("clang++")
            print(f"selected_compiler={clang_path} {clangxx_path} (fallback Clang)")
    else:
        clang_path = shutil.which("clang")
        clangxx_path = shutil.which("clang++")
        print(f"selected_compiler={clang_path} {clangxx_path} (fallback Clang)")
PY
            ' "$image"
          done

      - name: Show versions used by CinderX build jobs
        shell: bash
        run: |
          set -euxo pipefail
          echo "gcc=$(gcc --version | head -n 1 || true)"
          echo "g++=$(g++ --version | head -n 1 || true)"
          echo "clang=$(clang --version | head -n 1 || true)"
          echo "cmake=$(cmake --version | head -n 1 || true)"
          echo "ninja=$(ninja --version || true)"
          echo "make=$(make --version | head -n 1 || true)"
          echo "python=$(python --version 2>&1 || true)"
          echo "pip=$(pip --version || true)"
          echo "cibuildwheel=$(python -m cibuildwheel --version || true)"
          echo "git=$(git --version || true)"
          echo "docker=$(docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' || true)"
