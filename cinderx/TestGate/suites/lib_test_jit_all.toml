fail_fast = true

[target]
python = "3.14"
arch = "arm64"
system = "Linux"

[[jobs]]
name = "setup_release"
command = "mkdir -p \"{run_dir}/wheelhouse\" && \"$CINDERX_TEST_PYTHON\" -m pip wheel --no-build-isolation --no-deps -w \"{run_dir}/wheelhouse\" . && rm -rf \"{run_dir}/venv\" && \"$CINDERX_TEST_PYTHON\" -m venv \"{run_dir}/venv\" && \"{run_dir}/venv/bin/python\" -m pip install --upgrade pip pytest && \"{run_dir}/venv/bin/python\" -m pip install --no-index --find-links=\"{run_dir}/wheelhouse\" cinderx"
[jobs.env]
ENABLE_XXCLASSLOADER = "1"

[[jobs]]
name = "lib_test_release_frame_eval_jit_all"
command = "\"{run_dir}/venv/bin/python\" cinderx/TestGate/lib_test_runner.py --mode frame-eval-jit-all --num-workers auto --worker-timeout 1200 --defer-pattern test.test_asyncio --test-list-file \"{run_dir}/lib_test_release_frame_eval_jit_all_tests.txt\" --json-summary-file \"{run_dir}/lib_test_release_frame_eval_jit_all.json\""
